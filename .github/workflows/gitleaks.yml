name: gitleaks

# Reusable org-wide secret scanner (Amperstrand/.github#1).
# Full git-history scan with the pinned gitleaks binary — no third-party
# action dependency, no license question, deterministic version.
#
# Callers add:
#   jobs:
#     gitleaks:
#       uses: Amperstrand/.github/.github/workflows/gitleaks.yml@main
#
# Caller repos may drop a .gitleaks.toml at their root; it is picked up
# automatically for allowlists (test fixtures, remediated historical paths).

on:
  workflow_call:
    inputs:
      # JSON runs-on array. Defaults to hosted so existing public callers
      # are unaffected; billing-blocked private callers opt in with
      # '["self-hosted", "legion-vm"]' (Amperstrand/ops#43).
      runner:
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NOTE (2026-10-07): this workflow failed with zero output on every
      # event since 2026-10-05 across all callers. Rebuilt scoped-by-event
      # (same fix the three active repos already shipped locally as
      # tollgate-module-basic-go#108 / PRTA#22 / omarchy-cashu#64):
      #   pull_request -> new commits only (fast, always relevant)
      #   push         -> the pushed range (direct pushes skip PR scans)
      #   schedule     -> full history (rule updates + old smuggles)
      # Callers' repo .gitleaks.toml MUST start with:
      #   [extend]\nuseDefault = true
      # — a config without it silently REPLACES the default ruleset
      # (found live in PRTA and nodns-poc). And allowlists suppressing
      # generic-api-key need regexTarget = "match" (the "secret" target
      # does not apply to that rule's group resolution).
      #
      # NOTE (2026-10-30): install failures were masquerading as leak
      # findings — on the legion-vm self-hosted runner the tarball download
      # died with curl exit 23 ("Failure writing output to destination",
      # i.e. /tmp write failure, likely ENOSPC) and the job showed a plain
      # red "gitleaks" with no findings context (cashu-cf push runs since
      # 10-29). Install is now its own step: $RUNNER_TEMP destination,
      # binary validation, pinned-Docker fallback, and an explicit
      # install-vs-leak error message.

      - name: Install gitleaks v8.30.1 (pinned; Docker fallback)
        run: |
          set -uo pipefail
          VERSION="8.30.1"
          BINDIR="${RUNNER_TEMP:-/tmp}"
          TGZ="${BINDIR}/gitleaks.tgz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          if curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors "$URL" -o "$TGZ" \
             && tar -xzf "$TGZ" -C "$BINDIR" gitleaks \
             && "$BINDIR/gitleaks" version >/dev/null 2>&1; then
            echo "gitleaks binary OK: $BINDIR/gitleaks ($("$BINDIR/gitleaks" version))"
            echo "GITLEAKS_CMD=$BINDIR/gitleaks" >> "$GITHUB_ENV"
          elif command -v docker >/dev/null 2>&1 \
             && docker pull -q "zricethezav/gitleaks:v${VERSION}" >/dev/null 2>&1; then
            echo "binary install to ${BINDIR} failed — using pinned Docker image zricethezav/gitleaks:v${VERSION}"
            {
              echo "GITLEAKS_CMD<<GITLEAKS_EOF"
              echo "docker run --rm -v ${PWD}:/src -w /src zricethezav/gitleaks:v${VERSION}"
              echo "GITLEAKS_EOF"
            } >> "$GITHUB_ENV"
          else
            echo "::error::gitleaks INSTALL failed — this is NOT a leak finding. Binary download/extract to ${BINDIR} failed (curl exit 23 = write failure: check runner disk space) and the Docker fallback is unavailable. On self-hosted runners: free disk, verify \${RUNNER_TEMP} writability, or install Docker."
            exit 1
          fi

      - name: Run gitleaks (scoped by event)
        run: |
          set -euo pipefail
          CONFIG=""
          [ -f .gitleaks.toml ] && CONFIG="--config .gitleaks.toml"
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -n "${BASE:-}" ] && git cat-file -e "$BASE" 2>/dev/null; then
            echo "scanning new commits only: $BASE..HEAD"
            $GITLEAKS_CMD git . --redact --verbose $CONFIG --log-opts="$BASE..HEAD"
          else
            echo "no resolvable base — scanning full history"
            $GITLEAKS_CMD git . --redact --verbose $CONFIG
          fi
